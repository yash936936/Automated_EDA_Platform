services:
  redis:
    image: redis:7
    command: redis-server --maxmemory-policy noeviction
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eda_platform
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
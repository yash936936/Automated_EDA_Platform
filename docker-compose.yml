services:
  redis:
    image: redis:7
    command: redis-server --maxmemory-policy noeviction
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eda_platform
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-applies 000_extensions.sql then 001_init.sql, in filename order,
      # on first container start with a *fresh* volume only. If pgdata
      # already exists from a previous run, Postgres skips this folder
      # entirely -- run the two files manually with psql in that case (see
      # README), or `docker compose down -v` to force a clean re-init.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API -- matches S3_ENDPOINT in .env.example
      - "9001:9001"   # web console, for eyeballing uploaded objects
    volumes:
      - miniodata:/data
  # One-shot container that creates the bucket on first startup and then
  # exits (status 0) -- `docker compose up` will show it as "Exited (0)",
  # that's expected, not a failure. Re-running is a no-op if the bucket
  # already exists (`mc mb -p` is idempotent).
  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/eda-platform-datasets;
      exit 0;
      "
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # UI on a non-default host port (16687, not 16686) so this doesn't
      # collide if you already have a separate Jaeger container running for
      # something else -- check what's already using 16686 with
      # `docker ps` before assuming 16686 is free on your machine.
      - "16687:16686"
      # OTLP HTTP receiver -- this is what services/api/src/tracing.ts and
      # agent_worker/tracing.py export spans to (OTEL_EXPORTER_OTLP_ENDPOINT
      # in .env.example defaults to this).
      - "4318:4318"
volumes:
  pgdata:
  miniodata:
services:
  redis:
    image: redis:7
    command: redis-server --maxmemory-policy noeviction
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eda_platform
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-applies 000_extensions.sql then 001_init.sql, in filename order,
      # on first container start with a *fresh* volume only. If pgdata
      # already exists from a previous run, Postgres skips this folder
      # entirely -- run the two files manually with psql in that case (see
      # README), or `docker compose down -v` to force a clean re-init.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  seaweedfs:
    # See docs/decisions.md D-014: MinIO's open-source project was archived
    # by its own maintainers (April 2026) and, as of Sept 2026, pulled its
    # images from public access on BOTH Docker Hub and quay.io -- not a
    # broken tag, a deliberate shutdown of free distribution. SeaweedFS is a
    # separate, unrelated, still-actively-built (Apache 2.0) project with
    # its own S3-compatible gateway; `server -s3` runs a single-node
    # master+volume+filer+S3-API stack in one container, which is all this
    # dev setup needs. No `mc`-equivalent sidecar needed -- the API gateway
    # and agent worker each create the bucket themselves at startup (see
    # ensureBucket()/ensure_bucket() in storage.ts/storage.py).
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"   # S3-compatible API -- matches S3_ENDPOINT in .env.example
      - "9333:9333"   # master API/status, handy for poking at cluster health
    volumes:
      - seaweedfsdata:/data
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # UI on a non-default host port (16687, not 16686) so this doesn't
      # collide if you already have a separate Jaeger container running for
      # something else -- check what's already using 16686 with
      # `docker ps` before assuming 16686 is free on your machine.
      - "16687:16686"
      # OTLP HTTP receiver -- this is what services/api/src/tracing.ts and
      # agent_worker/tracing.py export spans to (OTEL_EXPORTER_OTLP_ENDPOINT
      # in .env.example defaults to this).
      - "4318:4318"
volumes:
  pgdata:
  seaweedfsdata: